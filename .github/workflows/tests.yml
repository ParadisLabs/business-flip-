name: Flip Broker regression tests

on:
  pull_request:
    paths:
      - "flip_broker.py"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile flip_broker.py
      - name: Run mocked regression tests
        run: python -m unittest discover -s tests -v
